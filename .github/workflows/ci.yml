name: ci
on: [push, pull_request]

# Cross-repo dependency: agentic-kgcs depends on `kg_contracts`, shipped by the
# sibling `agentic-kgis` distribution (ADR-0002 as amended). That distribution is
# public but not on any package index, so CI installs it from git BEFORE the
# editable install of this repo, pinned to `main`. The kg_contracts code must be
# merged to agentic-kgis `main` for this job to pass — kgcs PR #4 is gated on
# agentic-kgis PR #6 (kg_contracts v2) merging first. It is NOT pinned to a
# feature branch, which would break once that branch is deleted.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PEP 508 named direct reference: pip records this as satisfying the
      # `agentic-kgis>=0.2.0` requirement by name, so the editable install below
      # does not try to re-resolve it from a package index (where it does not
      # exist). `@main` makes the ref explicit. agentic-kgis is public, so no
      # token is needed for the clone.
      - run: pip install "agentic-kgis @ git+https://github.com/djjay0131/agentic-kgis.git@main"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -v
