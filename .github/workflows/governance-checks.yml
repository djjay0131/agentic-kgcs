name: Governance Checks

# Runs the canonical agentic-governance ruleset (delta / ADR / L0-allowlist /
# layout checks) against this repo on every PR and on pushes to main.
#
# The checker lives in the public agentic-governance repo, not here, so this
# job fetches it pinned to a commit SHA for reproducibility. Keep the SHA in
# sync with the governance version pinned in
# llm/governance/governance-delta.md. It is cloned OUTSIDE the workspace so
# the script's own file scan (rooted at `git rev-parse --show-toplevel`) does
# not walk into it.
#
# --layout is required, not optional: it is what makes the two-plane rule
# (llm/ = control plane, docs/ = data plane) enforceable rather than merely
# documented. Without it this workflow would pass over a repo that had
# drifted back.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-checks:
    name: Governance Checks
    runs-on: ubuntu-latest
    env:
      GOVERNANCE_REPO: djjay0131/agentic-governance
      # agentic-governance v0.6.1
      GOVERNANCE_REF: 195a23afe7ecc1603b30fbfdd4a70219882b8a24
    steps:
      - name: Check out repo (full history so origin/main exists for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main ref is present
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch pinned canonical governance ruleset (outside the workspace)
        run: |
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${GOVERNANCE_REPO}.git" "${RUNNER_TEMP}/governance-src"
          git -C "${RUNNER_TEMP}/governance-src" checkout --quiet "${GOVERNANCE_REF}"

      - name: Run governance checks
        run: node "${RUNNER_TEMP}/governance-src/plugin/scripts/governance-checks.mjs" --layout
