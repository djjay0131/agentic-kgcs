[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-kgcs"
version = "2.0.0"
description = "Knowledge Graph Curation Service (admission, curation core + executor, review)"
requires-python = ">=3.11"
# 0.3.0 (agentic-kgis de48639) is the first release carrying
# `IdentityDisposition` / `ConfidencePolicy.route(..., identity_disposition=)`,
# which KGCS's ResolutionPolicy now requires (KGCS ADR-0022, issue #43).
# It is a floor, not a pin. `RESTORE_IDENTITY` (KGIS ADR-0027, PR #55) is on
# agentic-kgis `main` but has had no tagged release (agentic-kgis is still
# 0.3.0), so there is no higher version to raise the floor to. CI installs
# `agentic-kgis @ git+https://github.com/djjay0131/agentic-kgis.git@main`; to
# make that floating install fail loudly instead of silently on contract drift,
# the expected `INVERSE_OPERATION_TYPES` table is pinned by
# tests/kgcs/test_compensate.py::TestInverseMap::test_the_contract_inverse_table_is_the_one_kgcs_adopts.
dependencies = ["agentic-kgis>=0.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/kgcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Rule set pinned explicitly (ruff is pinned in dev deps) so CI and local
# never drift: the prior E/F defaults plus I (import sorting). Broader 0.16
# default families (UP/RUF/PERF/DTZ/B) are a deliberate future opt-in.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["kgcs", "helpers", "e2e_harness", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
